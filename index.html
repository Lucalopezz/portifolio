<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Lucas Dalossa Lopes — desenvolvedor full stack com foco em back-end. Projetos com TypeScript, NestJS e Laravel, e experiência na EESC-USP."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Lucas Dalossa Lopes | Desenvolvedor Full Stack</title>
    <script>
      // Apply the theme before the first paint; useTheme reads this value on mount.
      ;(() => {
        let saved
        try {
          saved = localStorage.getItem('portfolio-theme')
        } catch {}
        document.documentElement.dataset.theme =
          saved === 'light' || saved === 'dark'
            ? saved
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
